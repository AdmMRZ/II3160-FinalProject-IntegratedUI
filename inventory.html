<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Inventory | LogTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-72 bg-slate-950 text-white flex flex-col p-6 shadow-2xl">
        <div class="text-2xl font-black mb-10 flex items-center gap-3"><i data-lucide="package-search" class="text-indigo-500"></i> LogTrack</div>
        <nav class="flex-1 space-y-2">
            <a href="index.html" class="nav-link"><i data-lucide="layout-dashboard" class="mr-3"></i> Dashboard</a>
            <a href="inventory.html" class="nav-link active"><i data-lucide="box" class="mr-3"></i> Inventory</a>
            <a href="shipment.html" class="nav-link"><i data-lucide="truck" class="mr-3"></i> Shipments</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-10">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h2 class="text-4xl font-black">Warehouse</h2>
                <p class="text-slate-500 font-medium">Manage stock and initiate shipment protocol.</p>
            </div>
            <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl hover:bg-indigo-700 transition">Add New Entry</button>
        </div>

        <div class="table-container shadow-xl">
            <table>
                <thead>
                    <tr><th>Item Details</th><th>Specs</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="inventory-list"></tbody>
            </table>
        </div>

        <div id="modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-[2rem] p-10 w-full max-w-md shadow-2xl animate-slide-up">
                <h3 class="text-2xl font-black mb-6">Register Package</h3>
                <form id="addForm" class="space-y-4">
                    <input type="text" id="name" placeholder="Name" class="w-full bg-slate-50 border p-4 rounded-xl outline-indigo-500" required>
                    <input type="number" id="weight" placeholder="Weight (kg)" class="w-full bg-slate-50 border p-4 rounded-xl outline-indigo-500" required>
                    <div class="grid grid-cols-3 gap-3">
                        <input type="number" id="L" placeholder="L" class="bg-slate-50 border p-4 rounded-xl" required>
                        <input type="number" id="W" placeholder="W" class="bg-slate-50 border p-4 rounded-xl" required>
                        <input type="number" id="H" placeholder="H" class="bg-slate-50 border p-4 rounded-xl" required>
                    </div>
                    <div class="flex gap-4 pt-6">
                        <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="flex-1 font-bold text-slate-400">Cancel</button>
                        <button type="submit" class="flex-1 bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const AUTH = "Bearer RahasiaTST2026";
        async function load() {
            const res = await fetch('https://18223015.tesatepadang.space/api/packages/', { headers: { "Authorization": AUTH } });
            const data = await res.json();
            document.getElementById('inventory-list').innerHTML = data.map(p => {
                let statusClass = "bg-amber-100 text-amber-700"; 
                
                if (p.status === 'PENDING') {
                    statusClass = "bg-amber-100 text-amber-700"; 
                } else if (p.status === 'SHIPPED') {
                    statusClass = "bg-green-100 text-green-700"; 
                }

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="font-bold text-slate-800">${p.name} <p class="text-[10px] text-slate-400 font-normal">ID: #${p.id}</p></td>
                        <td class="text-slate-500 text-sm">${p.weight}kg | ${p.length}x${p.width}x${p.height}cm</td>
                        
                        <td>
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${statusClass}">
                                ${p.status}
                            </span>
                        </td>
                        
                        <td>
                            ${p.status === 'PENDING' ? `
                                <div class="flex items-center gap-2">
                                    <select id="courier-${p.id}" class="text-xs border border-slate-200 p-2 rounded-lg bg-white outline-indigo-500 font-bold text-slate-600">
                                        <option value="TST-Express">TST Express</option>
                                        <option value="JNE">JNE Logistics</option>
                                        <option value="J&T">J&T Cargo</option>
                                        <option value="SiCepat">SiCepat</option>
                                        <option value="Anteraja">Anteraja</option>
                                    </select>
                                    <button onclick="ship(${p.id})" class="bg-indigo-600 text-white p-2 rounded-lg hover:bg-indigo-700 transition shadow-md">
                                        <i data-lucide="send" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            ` : `
                                <span class="text-slate-400 italic text-xs flex items-center gap-1">
                                    <i data-lucide="check-circle" class="w-3 h-3 text-green-500"></i> 
                                    ${p.status === 'SHIPPED' ? 'Completed' : 'On Process'}
                                </span>
                            `}
                        </td>
                    </tr>`;
            }).join('');
            lucide.createIcons(); 
        }
        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            await fetch('https://18223015.tesatepadang.space/api/packages/', {
                method: 'POST', headers: { "Content-Type": "application/json", "Authorization": AUTH },
                body: JSON.stringify({ name: document.getElementById('name').value, weight: parseFloat(document.getElementById('weight').value), length: parseInt(document.getElementById('L').value), width: parseInt(document.getElementById('W').value), height: parseInt(document.getElementById('H').value) })
            });
            document.getElementById('modal').classList.add('hidden');
            load();
        };
        async function ship(id) {
            const courier = document.getElementById(`courier-${id}`).value;

            if(!confirm(`Confirm shipment of package #${id} via ${courier}?`)) return;

            try {
                const res = await fetch('https://18223042.tesatepadang.space/api/shipments/', {
                    method: 'POST', 
                    headers: { "Content-Type": "application/json", "Authorization": AUTH },
                    body: JSON.stringify({ 
                        package_id: id, 
                        courier_name: courier 
                    })
                });

                if(res.ok) {
                    alert(`Success! Package is being shipped via ${courier}.`);
                    load(); 
                } else {
                    const err = await res.json();
                    alert("Failed: " + (err.error || "Internal Server Error"));
                }
            } catch (e) {
                alert("Connection to shipment service lost!");
            }
        }
        window.onload = load;
    </script>
</body>
</html>
