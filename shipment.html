<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Tracking | TST Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-72 bg-slate-950 text-white flex flex-col p-6 shadow-2xl">
        <div class="text-2xl font-black mb-10 flex items-center gap-3"><i data-lucide="package-search" class="text-indigo-500"></i> TST LOGISTICS</div>
        <nav class="flex-1 space-y-2">
            <a href="index.html" class="nav-link"><i data-lucide="layout-dashboard" class="mr-3"></i> Dashboard</a>
            <a href="inventory.html" class="nav-link"><i data-lucide="box" class="mr-3"></i> Inventory</a>
            <a href="shipment.html" class="nav-link active"><i data-lucide="truck" class="mr-3"></i> Shipments</a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-10 space-y-10">
        <div>
            <h2 class="text-4xl font-black mb-2">Live Tracking</h2>
            <div class="flex gap-4 max-w-2xl mt-6">
                <input id="search-id" type="text" placeholder="Resi Number (e.g. TRX-XXXX)..." class="flex-1 border p-5 rounded-[1.5rem] outline-indigo-600 shadow-sm font-bold">
                <button onclick="track()" class="bg-indigo-600 text-white px-10 rounded-[1.5rem] font-bold shadow-xl hover:bg-indigo-700 transition">Track Package</button>
            </div>
        </div>

        <div id="track-display"></div>

        <div class="table-container shadow-lg p-8 bg-white rounded-[2rem]">
            <h3 class="text-lg font-bold mb-6 text-slate-400 uppercase tracking-widest">Global Shipping Log</h3>
            <div id="ship-log" class="space-y-4"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const AUTH = "Bearer RahasiaTST2026";

        async function track() {
            const pid = document.getElementById('search-id').value;
            if(!pid) return alert("Masukkan nomor resi dulu!");

            const res = await fetch('http://localhost:8001/api/shipments/', { 
                headers: { "Authorization": AUTH } 
            });
            const data = await res.json();
            const s = data.find(i => i.tracking_number == pid);

            if(!s) return alert("Package Not Found!");

            // Cek apakah statusnya sudah DELIVERED
            const isDelivered = s.status === 'DELIVERED';

            document.getElementById('track-display').innerHTML = `
                <div class="bg-indigo-600 text-white p-12 rounded-[2.5rem] shadow-2xl flex justify-between items-center animate-slide-up">
                    <div class="space-y-8">
                        <div>
                            <p class="text-indigo-200 text-xs font-black uppercase tracking-widest">Shipment Status</p>
                            <h4 class="text-5xl font-black mt-2 tracking-tight">${s.tracking_number}</h4>
                            <div class="mt-4">
                                <span class="px-4 py-1.5 rounded-full text-sm font-black uppercase ${isDelivered ? 'bg-green-400 text-green-950' : 'bg-yellow-400 text-yellow-950'}">
                                    ${s.status}
                                </span>
                            </div>
                        </div>
                        <div class="flex gap-12">
                            <div>
                                <p class="text-indigo-300 text-[10px] uppercase font-bold">Current Point</p>
                                <p class="text-2xl font-bold">${s.current_location}</p>
                            </div>
                            <div>
                                <p class="text-indigo-300 text-[10px] uppercase font-bold">Courier Service</p>
                                <p class="text-2xl font-bold">${s.courier_name}</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white/10 p-8 rounded-[2rem] border border-white/20 backdrop-blur-md min-w-[320px]">
                        ${!isDelivered ? `
                            <p class="text-sm font-bold mb-4 uppercase text-indigo-100">Update Location</p>
                            <input id="updLoc" type="text" placeholder="Enter City Name..." class="w-full bg-white/10 border border-white/30 p-4 rounded-xl text-white mb-4 outline-none placeholder:text-white/40 font-bold">
                            <button onclick="updateStatus(${s.id}, 'location')" class="w-full bg-white text-indigo-600 p-4 rounded-xl font-black hover:bg-indigo-50 transition shadow-lg mb-3">Update Location</button>
                            <button onclick="updateStatus(${s.id}, 'delivered')" class="w-full bg-green-500 text-white p-4 rounded-xl font-black hover:bg-green-400 transition shadow-lg">Mark as Delivered ✓</button>
                        ` : `
                            <div class="text-center py-6">
                                <div class="bg-green-400 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <i data-lucide="check" class="text-green-950 w-10 h-10"></i>
                                </div>
                                <h5 class="text-2xl font-black">Package Delivered</h5>
                                <p class="text-indigo-200 text-sm mt-2">No further actions needed.</p>
                            </div>
                        `}
                    </div>
                </div>`;
            lucide.createIcons();
        }

        async function updateStatus(sid, type) {
            let payload = {};
            
            if (type === 'location') {
                const loc = document.getElementById('updLoc').value;
                if (!loc) return alert("Isi nama kota dulu!");
                payload = { location: loc };
            } else if (type === 'delivered') {
                if(!confirm("Yakin paket sudah sampai di tujuan?")) return;
                payload = { 
                    status: "DELIVERED", 
                    location: "Destination (Received by Customer)" 
                };
            }

            try {
                const res = await fetch('http://localhost:8001/api/shipments/' + sid + '/', {
                    method: 'PATCH',
                    headers: { "Content-Type": "application/json", "Authorization": AUTH },
                    body: JSON.stringify(payload)
                });

                if(res.ok) {
                    track(); // Refresh detail display
                    loadLog(); // Refresh table
                } else {
                    alert("Gagal update status!");
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadLog() {
            const res = await fetch('http://localhost:8001/api/shipments/', { 
                headers: { "Authorization": AUTH } 
            });
            const data = await res.json();
            
            document.getElementById('ship-log').innerHTML = data.reverse().map(s => `
                <div class="flex justify-between items-center p-5 bg-slate-50 rounded-2xl border border-dashed border-slate-200 hover:border-indigo-300 transition">
                    <div class="flex items-center gap-4">
                        <div class="p-3 bg-white rounded-xl shadow-sm border border-slate-100">
                            <i data-lucide="${s.status === 'DELIVERED' ? 'check-circle' : 'truck'}" class="${s.status === 'DELIVERED' ? 'text-green-500' : 'text-indigo-500'}"></i>
                        </div>
                        <div>
                            <p class="font-black text-slate-800">${s.tracking_number}</p>
                            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-tighter">Package ID: ${s.package_id} • Courier: ${s.courier_name}</p>
                        </div>
                    </div>
                    <div class="text-right flex items-center gap-6">
                        <div>
                            <p class="text-xs font-black text-slate-800 uppercase">${s.current_location}</p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase">Last Point</p>
                        </div>
                        <div class="w-32">
                            <span class="px-3 py-1 rounded-lg text-[10px] font-black uppercase ${s.status === 'DELIVERED' ? 'bg-green-100 text-green-600' : 'bg-yellow-100 text-yellow-600'}">
                                ${s.status}
                            </span>
                        </div>
                    </div>
                </div>`).join('');
            lucide.createIcons();
        }

        window.onload = loadLog;
    </script>
</body>
</html>
