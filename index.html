<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LogTrack | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden bg-slate-50">
    <aside class="w-72 bg-slate-950 text-white flex flex-col p-6 shadow-2xl">
        <div class="text-2xl font-black mb-10 flex items-center gap-3 text-white">
            <i data-lucide="package-search" class="text-indigo-500"></i> LogTrack
        </div>
        <nav class="flex-1 space-y-2">
            <a href="index.html" class="flex items-center p-4 bg-indigo-600 rounded-2xl font-bold transition shadow-lg">
                <i data-lucide="layout-dashboard" class="mr-3"></i> Dashboard
            </a>
            <a href="inventory.html" class="flex items-center p-4 text-slate-400 hover:text-white transition font-bold">
                <i data-lucide="box" class="mr-3"></i> Inventory
            </a>
            <a href="shipment.html" class="flex items-center p-4 text-slate-400 hover:text-white transition font-bold">
                <i data-lucide="truck" class="mr-3"></i> Shipments
            </a>
        </nav>
        <div class="pt-6 border-t border-slate-800 text-[10px] text-slate-500 uppercase tracking-widest text-center">
            Final Project II3160 - TST
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-10">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-4xl font-black tracking-tight text-slate-800">System Overview</h2>
                <p class="text-slate-500 font-medium italic">Synchronized data from Warehouse & Shipment Services</p>
            </div>
            <div id="api-status" class="flex gap-2"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-10">
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 animate-slide-up">
                <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-4">Total Inventory</p>
                <h3 id="stat-total" class="text-5xl font-black text-slate-800">0</h3>
                <div class="mt-4 flex items-center text-[10px] font-bold text-slate-400 gap-1 uppercase">
                    <i data-lucide="archive" class="w-3 h-3"></i> Global Stock
                </div>
            </div>
            
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 animate-slide-up" style="animation-delay: 0.1s">
                <p class="text-indigo-400 text-xs font-black uppercase tracking-widest mb-4 text-indigo-500">In Transit</p>
                <h3 id="stat-shipped" class="text-5xl font-black text-indigo-600">0</h3>
                <div class="mt-4 flex items-center text-[10px] font-bold text-indigo-400 gap-1 uppercase">
                    <i data-lucide="truck" class="w-3 h-3"></i> On the road
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 animate-slide-up" style="animation-delay: 0.2s">
                <p class="text-amber-500 text-xs font-black uppercase tracking-widest mb-4">Pending</p>
                <h3 id="stat-pending" class="text-5xl font-black text-amber-500">0</h3>
                <div class="mt-4 flex items-center text-[10px] font-bold text-amber-500 gap-1 uppercase">
                    <i data-lucide="clock" class="w-3 h-3"></i> Awaiting Shipment
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 animate-slide-up" style="animation-delay: 0.3s">
                <p class="text-green-500 text-xs font-black uppercase tracking-widest mb-4">Delivered</p>
                <h3 id="stat-delivered" class="text-5xl font-black text-green-500">0</h3>
                <div class="mt-4 flex items-center text-[10px] font-bold text-green-500 gap-1 uppercase">
                    <i data-lucide="check-circle" class="w-3 h-3"></i> Finished
                </div>
            </div>
        </div>

        <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-[2.5rem] p-12 text-white shadow-2xl relative overflow-hidden">
            <div class="relative z-10">
                <h3 class="text-4xl font-black mb-4">Multi-Service Sync</h3>
            </div>
            <i data-lucide="share-2" class="absolute right-[-20px] bottom-[-20px] w-64 h-64 text-white opacity-10"></i>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const AUTH = "Bearer RahasiaTST2026";

        async function loadStats() {
            try {
                const [resWarehouse, resShipment] = await Promise.all([
                    fetch('https://18223015.tesatepadang.space/api/packages/', { headers: { "Authorization": AUTH } }),
                    fetch('https://18223042.tesatepadang.space/api/shipments/', { headers: { "Authorization": AUTH } })
                ]);

                const warehouseData = await resWarehouse.json();
                const shipmentData = await resShipment.json();

                document.getElementById('stat-total').innerText = warehouseData.length;
                document.getElementById('stat-pending').innerText = warehouseData.filter(p => p.status === 'PENDING').length;

                document.getElementById('stat-shipped').innerText = shipmentData.filter(s => s.status === 'IN_TRANSIT').length;
                document.getElementById('stat-delivered').innerText = shipmentData.filter(s => s.status === 'DELIVERED').length;

                document.getElementById('api-status').innerHTML = `
                    <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-[10px] font-black tracking-widest uppercase flex items-center gap-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        Services Online
                    </span>
                `;

            } catch (e) {
                console.error("Dashboard Error:", e);
                document.getElementById('api-status').innerHTML = `
                    <span class="bg-red-100 text-red-700 px-4 py-2 rounded-full text-[10px] font-black tracking-widest uppercase">
                        ● Connection Failure
                    </span>
                `;
            }
        }

        window.onload = loadStats;
    </script>
</body>
</html>
